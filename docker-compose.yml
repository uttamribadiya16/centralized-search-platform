version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: centralized-platform-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Account Service Backend
  account-service-backend:
    build:
      context: ./account-service/backend
      dockerfile: Dockerfile
    container_name: account-service-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Server=${DB_SERVER},${DB_PORT};Database=account-service;User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=true;
    ports:
      - "5001:5001"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - platform-network
    restart: unless-stopped

  # Account Service Frontend
  account-service-frontend:
    build:
      context: ./account-service/frontend
      dockerfile: Dockerfile
    container_name: account-service-web
    environment:
      - REACT_APP_API_URL=${REACT_APP_ACCOUNT_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - account-service-backend
    networks:
      - platform-network
    restart: unless-stopped

  # Offer Service Backend
  offer-service-backend:
    build:
      context: ./offer-service/backend/OfferService.API
      dockerfile: Dockerfile
    container_name: offer-service-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__DefaultConnection=Server=${DB_SERVER},${DB_PORT};Database=offer-service;User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=true;
      - ConnectionStrings__RabbitMQ=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}${RABBITMQ_VHOST}
      - AccountServiceBaseUrl=${ACCOUNT_SERVICE_URL}
    ports:
      - "5002:5002"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-network
    restart: unless-stopped

  # Offer Service Frontend
  offer-service-frontend:
    build:
      context: ./offer-service/frontend
      dockerfile: Dockerfile
    container_name: offer-service-web
    environment:
      - REACT_APP_API_URL=${REACT_APP_OFFER_API_URL}
      - REACT_APP_ACCOUNT_API_URL=${REACT_APP_ACCOUNT_API_URL}
      - REACT_APP_SEARCH_API_URL=${REACT_APP_SEARCH_API_URL}
    ports:
      - "3001:3001"
    depends_on:
      - offer-service-backend
      - account-service-backend
      - search-service-backend
    networks:
      - platform-network
    restart: unless-stopped

  # Purchase Service Backend
  purchase-service-backend:
    build:
      context: ./purchase-service/backend
      dockerfile: Dockerfile
    container_name: purchase-service-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5004
      - ConnectionStrings__DefaultConnection=Server=${DB_SERVER},${DB_PORT};Database=purchase-service;User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=true;
      - AccountServiceBaseUrl=${ACCOUNT_SERVICE_URL}
      - OfferServiceBaseUrl=${OFFER_SERVICE_URL}
      - RabbitMQ__HostName=${RABBITMQ_HOST}
      - RabbitMQ__Port=${RABBITMQ_PORT}
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - RabbitMQ__ExchangeName=${SEARCH_EXCHANGE_NAME}
    ports:
      - "5004:5004"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      offer-service-backend:
        condition: service_started
    networks:
      - platform-network
    restart: unless-stopped

  # Purchase Service Frontend
  purchase-service-frontend:
    build:
      context: ./purchase-service/frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_PURCHASE_API_URL}
    container_name: purchase-service-web
    environment:
      - REACT_APP_API_BASE_URL=${REACT_APP_PURCHASE_API_URL}
    ports:
      - "3002:3002"
    depends_on:
      - purchase-service-backend
      - account-service-backend
      - offer-service-backend
    networks:
      - platform-network
    restart: unless-stopped

  # Transport Service Backend
  transport-service-backend:
    build:
      context: ./transport-service/backend
      dockerfile: Dockerfile
    container_name: transport-service-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5005
      - ConnectionStrings__DefaultConnection=Server=${DB_SERVER},${DB_PORT};Database=transport-service;User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=true;
      - ACCOUNT_SERVICE_URL=${ACCOUNT_SERVICE_URL}
      - AccountServiceBaseUrl=${ACCOUNT_SERVICE_URL}
      - OFFER_SERVICE_URL=${OFFER_SERVICE_URL}
      - PURCHASE_SERVICE_URL=${PURCHASE_SERVICE_URL}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USERNAME=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    ports:
      - "5005:5005"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      account-service-backend:
        condition: service_started
      offer-service-backend:
        condition: service_started
      purchase-service-backend:
        condition: service_started
    networks:
      - platform-network
    restart: unless-stopped

  # Transport Service Frontend
  transport-service-frontend:
    build:
      context: ./transport-service/frontend
      dockerfile: Dockerfile
    container_name: transport-service-web
    environment:
      - REACT_APP_API_BASE_URL=${REACT_APP_TRANSPORT_API_URL}
      - REACT_APP_ACCOUNT_SERVICE_URL=${REACT_APP_ACCOUNT_API_URL}
      - REACT_APP_OFFER_SERVICE_URL=${REACT_APP_OFFER_API_URL}
      - REACT_APP_PURCHASE_SERVICE_URL=${REACT_APP_PURCHASE_API_URL}
    ports:
      - "3003:3000"
    depends_on:
      - transport-service-backend
    networks:
      - platform-network
    restart: unless-stopped

  # Search Service Backend
  search-service-backend:
    build:
      context: ./search-service/SearchService.API
      dockerfile: Dockerfile
    container_name: search-service-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5003
      - ConnectionStrings__Elasticsearch=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - ConnectionStrings__RabbitMQ=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}${RABBITMQ_VHOST}
    ports:
      - "5003:5003"
    depends_on:
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-network
    restart: unless-stopped

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: platform-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - platform-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Elasticsearch Search Engine
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: platform-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - platform-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  sqlserver_data:
    driver: local
  elasticsearch_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  platform-network:
    driver: bridge