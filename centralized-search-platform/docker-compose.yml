version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: centralized-platform-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Account Service Backend
  account-service-backend:
    build:
      context: ./account-service/backend
      dockerfile: Dockerfile
    container_name: account-service-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=account-service;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
    ports:
      - "5001:5001"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - platform-network
    restart: unless-stopped

  # Account Service Frontend
  account-service-frontend:
    build:
      context: ./account-service/frontend
      dockerfile: Dockerfile
    container_name: account-service-web
    environment:
      - REACT_APP_API_URL=http://localhost:5001/api
    ports:
      - "3000:3000"
    depends_on:
      - account-service-backend
    networks:
      - platform-network
    restart: unless-stopped

  # Offer Service Backend
  offer-service-backend:
    build:
      context: ./offer-service/backend/OfferService.API
      dockerfile: Dockerfile
    container_name: offer-service-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=offer-service;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
      - ConnectionStrings__RabbitMQ=amqp://admin:admin123@rabbitmq:5672/
      - AccountServiceBaseUrl=http://account-service-backend:5001
    ports:
      - "5002:5002"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-network
    restart: unless-stopped

  # Offer Service Frontend
  offer-service-frontend:
    build:
      context: ./offer-service/frontend
      dockerfile: Dockerfile
    container_name: offer-service-web
    environment:
      - REACT_APP_API_URL=http://localhost:5002/api
      - REACT_APP_ACCOUNT_API_URL=http://localhost:5001/api
      - REACT_APP_SEARCH_API_URL=http://localhost:5003/api
    ports:
      - "3001:3001"
    depends_on:
      - offer-service-backend
      - account-service-backend
      - search-service-backend
    networks:
      - platform-network
    restart: unless-stopped

  # Search Service Backend
  search-service-backend:
    build:
      context: ./search-service/SearchService.API
      dockerfile: Dockerfile
    container_name: search-service-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5003
      - ConnectionStrings__Elasticsearch=http://elasticsearch:9200
      - ConnectionStrings__RabbitMQ=amqp://admin:admin123@rabbitmq:5672/
    ports:
      - "5003:5003"
    depends_on:
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-network
    restart: unless-stopped

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: platform-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - platform-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Elasticsearch Search Engine
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: platform-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - platform-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  sqlserver_data:
    driver: local
  elasticsearch_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  platform-network:
    driver: bridge